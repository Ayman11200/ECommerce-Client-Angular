<div class="order-summary">Order Summary</div>
<div class="order-details">
  <div class="order-row">
    <span>Shipping</span>
    <strong>{{ basketService.shipping() | currency }}</strong>
  </div>
  <div class="order-row">
    <span>SubTotal</span>
    <strong>{{ basketService.subtotal() | currency }}</strong>
  </div>
  <div class="order-row order-total-row">
    <span>Total</span>
    <strong>{{ basketService.total() | currency }}</strong>
  </div>
</div>
