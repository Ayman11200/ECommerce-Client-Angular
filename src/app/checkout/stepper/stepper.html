<mat-stepper aria-label="Checkout steps" [linear]="false" #stepper (selectionChange)="onStepChange($event)">
  <mat-step [stepControl]="address">
    <ng-template matStepLabel>Shipping Address</ng-template>
    <app-address [address]="address"></app-address>
  </mat-step>

  <mat-step [stepControl]="deliveryForm" label="Delivery Method">
    <app-delivery [delivery]="deliveryForm"></app-delivery>
  </mat-step>

  <mat-step label="Payment">
    <ng-template matStepLabel>Payment</ng-template>
    <app-payment [address]="address" [delivery]="deliveryForm"></app-payment>
  </mat-step>
</mat-stepper>
