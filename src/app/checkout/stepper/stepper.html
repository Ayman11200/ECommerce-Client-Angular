<mat-stepper aria-label="Checkout steps" [selectedIndex]="1" [linear]="false" #stepper>
  <mat-step [stepControl]="address">
    <ng-template matStepLabel>Shipping Address</ng-template>
    <app-address [address]="address"></app-address>
  </mat-step>

  <mat-step [stepControl]="deliveryForm" label="Delivery Method">
    <app-delivery [delivery]="deliveryForm"></app-delivery>
  </mat-step>

  <mat-step>
    <ng-template matStepLabel>Order Confirmation</ng-template>
    <p>You are now done.</p>
    <div>
      <button matButton matStepperPrevious>Back</button>
      <button matButton (click)="stepper.reset()">Reset</button>
    </div>
  </mat-step>
</mat-stepper>
