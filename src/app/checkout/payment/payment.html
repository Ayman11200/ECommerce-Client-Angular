<div class="payment-section">
  <div class="payment-header">
    <h3 class="payment-title">Payment</h3>
  </div>

  @if (loading() || error()) {
    <div class="payment-overlay">
      @if (loading()) {
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p>Preparing secure payment…</p>
      }
      @if (error()) {
        <div class="alert alert-danger">{{ error() }}</div>
        <button mat-stroked-button color="primary" (click)="initializePayment()">Try again</button>
      }
    </div>
  }

  <!-- Payment Element: ستريب بيرسم فورم الكارت هنا -->
  <div #paymentElement class="stripe-payment-element"></div>

  <div class="payment-actions">
    <!-- Back: مقفول وقت الدفع، وبعد ما الدفع يتم -->
    <button mat-button matStepperPrevious [disabled]="paying() || paid()">Back</button>

    <!-- Pay Button: مقفول لحد ما الكارت يكتمل ولحد ما التحميل يخلص -->
    <button mat-flat-button color="primary" class="ms-auto" (click)="pay()" [disabled]="!canPay()">
      {{ paying() ? 'Processing...' : paid() ? 'Complete order' : 'Pay now' }}
    </button>
    
  </div>

</div>
