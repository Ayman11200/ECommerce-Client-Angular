<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 text-center">
      @if (loading()) {
        <div>
          <i class="fa fa-spinner fa-spin fa-4x" style="color: #0d6efd"></i>
          <h3 class="mt-3">Processing your payment...</h3>
          <p>Please wait while we confirm your order.</p>
        </div>
      }

      @if (!loading() && error()) {
        <div>
          <i class="fa fa-exclamation-circle fa-5x" style="color: #dc3545"></i>
          <h2 class="mt-3">Something went wrong</h2>
          <p class="mb-4">{{ error() }}</p>
          <button class="btn btn-primary" (click)="backToCheckout()">Back to Checkout</button>
        </div>
      }
    </div>
  </div>
</div>
