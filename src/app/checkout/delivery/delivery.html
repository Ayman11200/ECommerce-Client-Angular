<form [formGroup]="delivery" class="delivery-section">
  <div class="delivery-header">
    <h2 class="delivery-title">Delivery Method</h2>
  </div>

  <mat-radio-group
    aria-label="Select a delivery method"
    formControlName="secondCtrl"
    class="delivery-options"
  >
    @for (item of deliveryMethods(); track item.id) {
      <mat-radio-button (change)="setShippingRadio($event.value)" class="delivery-option" [value]="item.id">
        <span class="delivery-name">{{ item.name }}</span>
        <span class="delivery-description">{{ item.description }}</span>
        <span class="delivery-details">
          {{ item.deliveryTime }} · {{ item.price | currency }}
        </span>
      </mat-radio-button>
    }
  </mat-radio-group>

  <div class="delivery-actions">
    <button type="button" mat-button matStepperPrevious>Back</button>

    <button type="button" mat-button matStepperNext>Next</button>
  </div>
</form>
